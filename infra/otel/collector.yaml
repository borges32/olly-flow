# Spec 012: coletor OpenTelemetry só para desenvolvimento (perfil `otel` do compose). Recebe
# OTLP (HTTP 4318, gRPC 4317) e imprime o que chega (exportador `debug`). Em homologação e
# produção, a plataforma aponta para o coletor da instituição (OTEL_EXPORTER_OTLP_ENDPOINT).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
