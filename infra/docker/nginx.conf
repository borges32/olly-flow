# SPA + proxy da API na mesma origem (sem CORS), como o proxy do Vite em desenvolvimento.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve `api` a cada requisição (DNS do Docker): o nginx sobe mesmo se a API reiniciar.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # Eventos de execução em tempo real (socket.io, spec 003).
  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location = /health {
    proxy_pass $api_upstream;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rotas do React Router (ex.: /workflows/:id) servem o index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
