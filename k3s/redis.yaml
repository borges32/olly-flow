# Redis 7: fila de execuções (BullMQ), eventos em tempo real, cotas e agendamentos. Mesma imagem do
# docker-compose (redis:7-alpine), com o que o ambiente compartilhado exige a mais:
#   - senha (REDIS_PASSWORD do Secret; REDIS_URL da API e do worker usa a mesma);
#   - persistência AOF em volume: execuções na fila e agendamentos sobrevivem ao reinício;
#   - maxmemory-policy noeviction: o BullMQ não funciona se o Redis descartar chaves.
# Uma réplica: sem alta disponibilidade. Com um Redis gerenciado (ex.: Azure Cache for Redis),
# remova este arquivo do kustomization.yaml e aponte REDIS_URL para ele.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: olly-flow-redis-data
  labels:
    app.kubernetes.io/name: olly-flow-redis
    app.kubernetes.io/component: queue
spec:
  accessModes: ['ReadWriteOnce']
  # Sem storageClassName: usa a classe padrão do cluster (no ARO, managed-csi).
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olly-flow-redis
  labels:
    app.kubernetes.io/name: olly-flow-redis
    app.kubernetes.io/component: queue
spec:
  replicas: 1
  # Volume ReadWriteOnce: o pod antigo precisa sair antes de o novo montar.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: olly-flow-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: olly-flow-redis
        app.kubernetes.io/component: queue
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: olly-flow-redis
          image: olly-flow-redis
          imagePullPolicy: Always
          # A senha vai num arquivo de configuração em /tmp, e não na linha de comando (que
          # apareceria na lista de processos). `maxmemory` fica abaixo do limite do container.
          command: ['sh', '-c']
          args:
            - >-
              printf 'requirepass "%s"\n' "$REDIS_PASSWORD" > /tmp/redis.conf &&
              exec redis-server /tmp/redis.conf
              --dir /data
              --appendonly yes
              --appendfsync everysec
              --maxmemory 768mb
              --maxmemory-policy noeviction
              --protected-mode no
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: olly-flow-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          # REDISCLI_AUTH: o redis-cli lê a senha do ambiente, sem expô-la na linha de comando.
          readinessProbe:
            exec:
              command: ['sh', '-c', 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: olly-flow-redis-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# Só interno: a API e o worker acessam por redis://:SENHA@olly-flow-redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: olly-flow-redis
  labels:
    app.kubernetes.io/name: olly-flow-redis
    app.kubernetes.io/component: queue
spec:
  selector:
    app.kubernetes.io/name: olly-flow-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
