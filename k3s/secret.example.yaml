# MODELO: não versione valores reais e não inclua este arquivo no kustomization.yaml.
# Crie o Secret no namespace com os valores do ambiente, por exemplo:
#   oc -n olly-flow create secret generic olly-flow-secrets --from-env-file=olly-flow.env
# ou copie este arquivo para fora do repositório, preencha e aplique com `oc apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: olly-flow-secrets
  namespace: olly-flow
type: Opaque
stringData:
  # PostgreSQL 16 (ex.: Azure Database for PostgreSQL). Use sslmode=require fora do cluster.
  DATABASE_URL: postgres://USUARIO:SENHA@HOST:5432/olly?sslmode=require
  # Redis do namespace (redis.yaml): a mesma senha nas duas chaves.
  #   openssl rand -hex 32
  REDIS_PASSWORD: TROCAR
  REDIS_URL: redis://:TROCAR@olly-flow-redis:6379
  # Com um Redis gerenciado (ex.: Azure Cache for Redis, TLS na porta 6380), sem o redis.yaml:
  # REDIS_URL: rediss://:SENHA@HOST:6380
  # Chave mestra das credenciais (OLLY_KEY_PROVIDER=env): 32 bytes em base64.
  #   openssl rand -base64 32
  OLLY_MASTER_KEY: TROCAR
  # Salt do hash do mascaramento (spec 009), obrigatório em produção, mínimo de 16 caracteres.
  #   openssl rand -hex 32
  OLLY_MASKING_SALT: TROCAR
  # Object storage (S3 compatível).
  S3_ACCESS_KEY: TROCAR
  S3_SECRET_KEY: TROCAR
  # Só com OLLY_KEY_PROVIDER=vault e OLLY_VAULT_AUTH=approle:
  # OLLY_VAULT_ROLE_ID: TROCAR
  # OLLY_VAULT_SECRET_ID: TROCAR
