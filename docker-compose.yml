# Ambiente local (FR-002): PostgreSQL, Redis, IdP de desenvolvimento, object storage e Vault (spec 009).
# Uso: docker compose up -d --wait
#
# Profile `app`: também sobe a API, o worker e o frontend em containers, para testes de UX sem
# ferramentas de desenvolvimento. Usa as portas 3000 e 5173 (pare o `pnpm dev` antes):
#   docker compose --profile app up -d --build --wait   →   http://localhost:5173
# Spec 006 (FR-014): vários workers com `--scale worker=3`.
name: olly-flow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olly}
      POSTGRES_DB: ${POSTGRES_DB:-olly}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # IdP somente de desenvolvimento. O realm importado habilita o password grant,
    # que não deve existir em outros ambientes (NFR-003).
    image: quay.io/keycloak/keycloak:26.6
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
      # Emissor público fixo (o `iss` dos tokens é sempre localhost:8080, que é o que o
      # navegador usa). Os endpoints de backchannel (JWKS, token) respondem no endereço
      # pelo qual foram chamados, para a API em container usar http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak/olly-realm.json:/opt/keycloak/data/import/olly-realm.json:ro
    healthcheck:
      # A imagem não tem curl/wget; usa /dev/tcp do bash na porta de gerenciamento.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  minio:
    # As imagens oficiais do MinIO deixaram de ser publicadas; esta é a build mantida
    # pela Chainguard a partir do código-fonte (ver report.md da spec 001).
    image: cgr.dev/chainguard/minio:latest-dev@sha256:7c248c1d7832ff65a6345cb6ff7bf9cf081ccf88527f8d6f25bb9227801a5121
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-olly}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-olly-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-olly}
    # O bucket é criado aqui, e não num serviço one-shot, porque `docker compose up --wait`
    # falha quando um container termina, mesmo com código 0.
    entrypoint: ['sh', '-c']
    command:
      - >-
        rm -f /tmp/bucket-ready;
        minio server /data --console-address :9001 & pid=$$!;
        trap 'kill -TERM $$pid' TERM INT;
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
        mc mb --ignore-existing "local/$$S3_BUCKET" && touch /tmp/bucket-ready;
        wait $$pid
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9000/minio/health/live && test -f /tmp/bucket-ready
      interval: 5s
      timeout: 5s
      retries: 30

  vault:
    # Spec 009 (T002): Vault de desenvolvimento com Transit e AppRole (ADR-0007 pendente: o cofre
    # institucional é configurado pela infraestrutura). Dados persistidos no volume `vault-data`.
    image: hashicorp/vault:1.20
    entrypoint: ['sh', '/vault/dev/start-dev.sh']
    environment:
      OLLY_VAULT_ROLE_ID: ${OLLY_VAULT_ROLE_ID:-olly-api-dev-role}
      OLLY_VAULT_SECRET_ID: ${OLLY_VAULT_SECRET_ID:-olly-api-dev-secret}
    ports:
      - '8200:8200'
    volumes:
      - ./infra/vault:/vault/dev:ro
      - vault-data:/vault/file
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/vault-ready']
      interval: 3s
      timeout: 3s
      retries: 40

  db-init:
    # Aplica migrations e seed e continua vigiando: se o banco for recriado com a API no
    # ar (ex.: `docker compose down -v` sem o profile), o schema volta em segundos.
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    init: true
    command: ['db-keeper']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-olly}:${POSTGRES_PASSWORD:-olly}@postgres:5432/${POSTGRES_DB:-olly}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment: &app-env
      LOG_LEVEL: info
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-olly}:${POSTGRES_PASSWORD:-olly}@postgres:5432/${POSTGRES_DB:-olly}
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER_URL: http://localhost:8080/realms/olly
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/olly
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-olly-api}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-admin}
      # Spec 004: chave mestra das credenciais e destinos internos liberados. Spec 009: com
      # OLLY_KEY_PROVIDER=vault a chave vem do Vault (OLLY_MASTER_KEY só enquanto houver o que
      # migrar: `pnpm credentials:migrate --from env --to vault`).
      OLLY_KEY_PROVIDER: ${OLLY_KEY_PROVIDER:-env}
      OLLY_MASTER_KEY: ${OLLY_MASTER_KEY:?defina OLLY_MASTER_KEY no .env (ver .env.example)}
      OLLY_VAULT_ADDR: http://vault:8200
      OLLY_VAULT_AUTH: approle
      OLLY_VAULT_ROLE_ID: ${OLLY_VAULT_ROLE_ID:-olly-api-dev-role}
      OLLY_VAULT_SECRET_ID: ${OLLY_VAULT_SECRET_ID:-olly-api-dev-secret}
      # Spec 009: salt do hash do mascaramento (valor fictício de desenvolvimento).
      OLLY_MASKING_SALT: ${OLLY_MASKING_SALT:-olly-dev-masking-salt-0001}
      # Spec 010: o servidor MCP de teste (`mcp-test`) é interno; liberado só no desenvolvimento.
      OLLY_HTTP_ALLOWLIST: ${OLLY_HTTP_ALLOWLIST:-mcp-test}
      # Spec 005: a API fica atrás do nginx do serviço `web` (IP real para a allowlist do webhook).
      OLLY_TRUST_PROXY: 'true'
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-olly}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-olly-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-olly}
      # Spec 006: execuções pela fila; o serviço `worker` executa.
      OLLY_WORKER_CONCURRENCY: ${OLLY_WORKER_CONCURRENCY:-20}
      OLLY_PROJECT_MAX_CONCURRENT: ${OLLY_PROJECT_MAX_CONCURRENT:-20}
      OLLY_WEBHOOK_RATE_LIMIT_PER_MIN: ${OLLY_WEBHOOK_RATE_LIMIT_PER_MIN:-120}
      OLLY_DEFAULT_WORKFLOW_TIMEOUT: ${OLLY_DEFAULT_WORKFLOW_TIMEOUT:-300}
      # Spec 011: prazo da aprovação humana. Os modelos permitidos são cadastrados em
      # Administração › IA (sem reiniciar).
      OLLY_APPROVAL_TIMEOUT_HOURS: ${OLLY_APPROVAL_TIMEOUT_HOURS:-24}
    ports:
      - '3000:3000'
    depends_on:
      db-init:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    # Spec 006: consumidor da fila de execuções. Sem porta publicada, para escalar:
    #   docker compose --profile app up -d --scale worker=3
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    init: true
    environment: *app-env
    # SIGTERM: espera as execuções em andamento (OLLY_WORKER_SHUTDOWN_TIMEOUT, 60 s).
    stop_grace_period: 70s
    depends_on:
      db-init:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3101/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    ports:
      # Porta fixa: é o redirect URI registrado no client `olly-web` do realm.
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-test:
    # Spec 010, FR-013: servidor MCP de teste (Streamable HTTP em /mcp, SSE legado em /sse).
    # Cadastre-o em /admin/mcp com a URL http://mcp-test:3333/mcp. `MUTATE_SCHEMA=1` muda o
    # schema de `soma` (demonstração do bloqueio por snapshot).
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: mcp-test-server
    environment:
      MUTATE_SCHEMA: ${MCP_TEST_MUTATE_SCHEMA:-0}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3333/health']
      interval: 5s
      timeout: 5s
      retries: 20

  mock:
    # Spec 006 (carga, infra/load): API HTTP de mentira para o workflow do k6.
    profiles: ['load']
    image: nginx:1.29-alpine
    volumes:
      - ./infra/load/mock-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  vault-data:
