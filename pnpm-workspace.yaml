packages:
  - apps/*
  - packages/*
  # Spec 010: servidor MCP de teste e demonstração.
  - infra/mcp-test-server

# pnpm 10 não executa scripts de instalação por padrão; liberamos apenas o necessário.
onlyBuiltDependencies:
  - esbuild
  # Usa binário pré-compilado; o script só compila se não houver binário para a plataforma.
  - isolated-vm

# Dependências opcionais nativas/pós-instalação que não precisamos compilar.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - cpu-features
  # bullmq → msgpackr: usa o binário pré-compilado (pacote opcional) ou cai para JS puro.
  - msgpackr-extract
  - protobufjs
  - ssh2

# Correções de segurança em dependências transitivas (pnpm audit). Remover quando as
# dependências diretas passarem a exigir versões corrigidas.
overrides:
  # @nestjs/platform-fastify 11 fixa fastify 5.11.3 (GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58 e outras).
  fastify: ^5.12.5
  # @nestjs/swagger usa js-yaml 5.x vulnerável a DoS por merge keys.
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1
  # monaco-editor 0.57 fixa dompurify 3.4.15 (IN_PLACE + hook: XSS; correção de patch em 3.4.16).
  'dompurify@<3.4.16': ^3.4.16
